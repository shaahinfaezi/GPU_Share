apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: qwen-benchmark-mps-daemon
  namespace: llm-demo
  labels:
    app: qwen-benchmark-mps-daemon
spec:
  selector:
    matchLabels:
      app: qwen-benchmark-mps-daemon
  template:
    metadata:
      labels:
        app: qwen-benchmark-mps-daemon
    spec:
      hostPID: true
      hostNetwork: true
      tolerations:
        - key: nvidia.com/gpu
          operator: Exists
          effect: NoSchedule
      initContainers:
        - name: prepare-mps
          image: nvidia/cuda:12.4.1-base-ubuntu22.04
          securityContext:
            privileged: true
          command: ["/bin/bash", "-c"]
          args:
            - |
              set -e
              mkdir -p /tmp/nvidia-mps
              chmod 1777 /tmp/nvidia-mps
              rm -rf /tmp/nvidia-mps/* || true
              nvidia-smi -c EXCLUSIVE_PROCESS || true
          volumeMounts:
            - name: mps-pipe
              mountPath: /tmp/nvidia-mps
      containers:
        - name: mps
          image: nvidia/cuda:12.4.1-base-ubuntu22.04
          securityContext:
            privileged: true
          env:
            - name: CUDA_MPS_PIPE_DIRECTORY
              value: /tmp/nvidia-mps
            - name: CUDA_MPS_LOG_DIRECTORY
              value: /tmp/nvidia-mps
          command: ["/bin/bash", "-c"]
          args:
            - |
              set -e
              export CUDA_MPS_PIPE_DIRECTORY=/tmp/nvidia-mps
              export CUDA_MPS_LOG_DIRECTORY=/tmp/nvidia-mps
              nvidia-cuda-mps-control -d
              while true; do
                sleep 30
              done
          volumeMounts:
            - name: mps-pipe
              mountPath: /tmp/nvidia-mps
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 100m
              memory: 128Mi
      volumes:
        - name: mps-pipe
          hostPath:
            path: /tmp/nvidia-mps
            type: DirectoryOrCreate
