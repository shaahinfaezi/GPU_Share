# MPS-only concurrent execution.
#
# Both services keep the same absolute VRAM budget as the sequential baseline
# (0.30 x 12288 MiB = 3686 MiB each) so only the sharing mechanism differs.
#
# MPS gives no VRAM isolation. CUDA_MPS_ACTIVE_THREAD_PERCENTAGE is read from
# the *client* process environment, so it is set here (not on the daemon) and
# caps each service at half the SM throughput.
#
# The mps-pipe volume uses hostPath type Directory on purpose: if the MPS
# daemon is not running the Pod fails to start instead of silently running
# without MPS and producing a measurement that looks valid but is not.
apiVersion: serving.kserve.io/v1alpha1
kind: LLMInferenceService
metadata:
  name: qwen-bench-01
  namespace: llm-demo
  labels:
    qwen-benchmark-mode: mps
spec:
  model:
    name: Qwen/Qwen2.5-0.5B-Instruct
    uri: pvc://qwen-local-pv-claim/
  replicas: 1
  router:
    scheduler: {}
    route: {}
    gateway:
      refs:
        - name: kserve-ingress-gateway
          namespace: kserve
  template:
    containers:
      - name: main
        image: 127.0.0.1:5000/kserve/huggingfaceserver:v0.17.0-gpu
        args:
          - --gpu-memory-utilization=0.30
          - --max-model-len=512
          - --max-num-seqs=1
          - --no-enable-prefix-caching
        resources:
          limits:
            cpu: '2'
            memory: 6Gi
            nvidia.com/gpu: "1"
          requests:
            cpu: '100m'
            memory: 1Gi
            nvidia.com/gpu: "1"
        env:
          - name: HF_HOME
            value: "/mnt/models"
          - name: CUDA_MPS_PIPE_DIRECTORY
            value: "/tmp/nvidia-mps"
          - name: CUDA_MPS_LOG_DIRECTORY
            value: "/tmp/nvidia-mps"
          - name: CUDA_MPS_ACTIVE_THREAD_PERCENTAGE
            value: "50"
        volumeMounts:
          - name: mps-pipe
            mountPath: /tmp/nvidia-mps
            readOnly: false
    volumes:
      - name: mps-pipe
        hostPath:
          path: /tmp/nvidia-mps
          type: Directory
---
