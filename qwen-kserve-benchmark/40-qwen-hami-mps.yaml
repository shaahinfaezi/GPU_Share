# HAMi (scheduling + VRAM quota) plus MPS (CUDA process sharing).
#
# Same --gpu-memory-utilization=0.90 reasoning as 30-qwen-hami.yaml: under HAMi
# the value is a fraction of the 4096 MiB quota, not of the 12288 MiB device.
#
# CUDA_MPS_ACTIVE_THREAD_PERCENTAGE and nvidia.com/gpucores are two independent
# throttles applied to the same process. Both are set to 50 so they agree;
# leaving them inconsistent makes the result impossible to attribute.
apiVersion: serving.kserve.io/v1alpha1
kind: LLMInferenceService
metadata:
  name: qwen-bench-01
  namespace: llm-demo
  labels:
    qwen-benchmark-mode: hami-mps
    qwen-hami-profile: balanced
spec:
  model:
    name: Qwen/Qwen2.5-0.5B-Instruct
    uri: pvc://qwen-local-pv-claim/
  replicas: 1
  router:
    scheduler: {}
    route: {}
    gateway:
      refs:
        - name: kserve-ingress-gateway
          namespace: kserve
  template:
    containers:
      - name: main
        image: 127.0.0.1:5000/kserve/huggingfaceserver:v0.17.0-gpu
        args:
          - --gpu-memory-utilization=0.90
          - --max-model-len=512
          - --max-num-seqs=1
          - --no-enable-prefix-caching
        resources:
          limits:
            cpu: '2'
            memory: 6Gi
            nvidia.com/gpu: "1"
            nvidia.com/gpumem: "4096"
            nvidia.com/gpucores: "50"
          requests:
            cpu: '100m'
            memory: 1Gi
            nvidia.com/gpu: "1"
            nvidia.com/gpumem: "4096"
            nvidia.com/gpucores: "50"
        env:
          - name: HF_HOME
            value: "/mnt/models"
          - name: CUDA_MPS_PIPE_DIRECTORY
            value: "/tmp/nvidia-mps"
          - name: CUDA_MPS_LOG_DIRECTORY
            value: "/tmp/nvidia-mps"
          - name: CUDA_MPS_ACTIVE_THREAD_PERCENTAGE
            value: "50"
        volumeMounts:
          - name: mps-pipe
            mountPath: /tmp/nvidia-mps
    volumes:
      - name: mps-pipe
        hostPath:
          path: /tmp/nvidia-mps
          type: Directory
---
