---
apiVersion: v1
kind: Pod
metadata:
  name: r2-vram-hog
  namespace: llm-demo
  labels: {r2-role: vram-hog}
spec:
  restartPolicy: Never
  containers:
    - name: hog
      image: 127.0.0.1:5000/kserve/huggingfaceserver:v0.17.0-gpu
      command: ["python3", "-c"]
      args:
        - |
          import torch, time, sys
          held = []
          # Claim in 512 MiB steps until the allocator refuses, then hold.
          while True:
              try:
                  held.append(torch.empty(512 * 1024 * 1024 // 2,
                                          dtype=torch.float16, device="cuda"))
                  print("held %d MiB" % (len(held) * 512), flush=True)
              except Exception as exc:
                  print("stopped at %d MiB: %s" % (len(held) * 512, exc),
                        flush=True)
                  break
          time.sleep(300)
      env:
        - name: NVIDIA_VISIBLE_DEVICES
          # "all" made the hog allocate on CUDA ordinal 0 -- and every one of
          # the 98 tenant allocations in this study landed on the OTHER card
          # (GPU-fa422f59, nvidia-smi index 1). HAMi's binpack has never once
          # chosen index 0. So the hog took the IDLE card, no victim request
          # ever failed, and the run reported "HAMi held its caps" having
          # tested nothing at all. The UUID is substituted from H.placement()
          # of the live tenants; GPU-fa422f59-3462-6e01-aece-96aeafeab30c is filled in by inject().
          value: "GPU-fa422f59-3462-6e01-aece-96aeafeab30c"
        - name: NVIDIA_DRIVER_CAPABILITIES
          value: compute,utility
      resources:
        # requests, not just limits. Kubernetes defaults requests to limits,
        # so `memory: 8Gi` alone asked for eight gigabytes of HOST RAM on a
        # node with ~7.5 GiB free and the pod sat Pending with
        # "Insufficient memory" -- three runs in a row that measured nothing.
        # The hog wants VRAM; its host footprint is a Python and a CUDA
        # context, which the rest of this study measures at about 3 GiB.
        requests: {cpu: "250m", memory: 512Mi}
        limits: {cpu: "2", memory: 3Gi}
