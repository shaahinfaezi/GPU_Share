apiVersion: v1
kind: Namespace
metadata:
  name: llm-demo
---
# Static local PVs. Both paths must be on new2's fast NVMe filesystem, not on
# the control plane and not on the worker's root filesystem.
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: zero-local-nvme
provisioner: kubernetes.io/no-provisioner
volumeBindingMode: WaitForFirstConsumer
reclaimPolicy: Retain
---
apiVersion: v1
kind: PersistentVolume
metadata:
  name: qwen-zero-models-pv
spec:
  capacity:
    storage: 20Gi
  volumeMode: Filesystem
  accessModes:
    - ReadWriteOnce
  persistentVolumeReclaimPolicy: Retain
  storageClassName: zero-local-nvme
  local:
    path: /srv/gpu-share/zero/models
  nodeAffinity:
    required:
      nodeSelectorTerms:
        - matchExpressions:
            - key: kubernetes.io/hostname
              operator: In
              values: [new2]
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: qwen-zero-models-pvc
  namespace: llm-demo
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: zero-local-nvme
  resources:
    requests:
      storage: 20Gi
  volumeName: qwen-zero-models-pv
---
apiVersion: v1
kind: PersistentVolume
metadata:
  name: qwen-zero-scratch-pv
spec:
  capacity:
    storage: 40Gi
  volumeMode: Filesystem
  accessModes:
    - ReadWriteOnce
  persistentVolumeReclaimPolicy: Retain
  storageClassName: zero-local-nvme
  local:
    path: /srv/gpu-share/zero/scratch
  nodeAffinity:
    required:
      nodeSelectorTerms:
        - matchExpressions:
            - key: kubernetes.io/hostname
              operator: In
              values: [new2]
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: qwen-zero-scratch-pvc
  namespace: llm-demo
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: zero-local-nvme
  resources:
    requests:
      storage: 40Gi
  volumeName: qwen-zero-scratch-pv
