version: '3.8'

services:
  gpu-scheduler:
    build:
      context: .
      dockerfile: docker/Dockerfile.scheduler
    environment:
      - NVIDIA_VISIBLE_DEVICES=all
      - MODEL_NAME=distilgpt2
    ports:
      - "6000-6003:5000"  # Adjust based on the number of instances
    volumes:
      - ./src:/app/src
      - ./configs:/app/configs
    runtime: nvidia
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 4G

networks:
  default:
    driver: bridge