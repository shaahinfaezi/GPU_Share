# Round-2 Grafana dashboard.
#
# Delivered as a ConfigMap because your Grafana came from kube-prometheus-stack,
# whose sidecar imports any ConfigMap labelled grafana_dashboard="1". Nothing is
# installed and no Grafana settings change.
#
#   kubectl apply -f 61-dashboard.yaml
#   # appears within ~30s under Dashboards -> "GPU Sharing - Round 2"
#
# Generated by make_dashboard.py -- edit that, not this file.
apiVersion: v1
kind: ConfigMap
metadata:
  name: r2-gpu-sharing-dashboard
  namespace: default
  labels:
    grafana_dashboard: "1"
data:
  r2-gpu-sharing.json: |
    {
      "uid": "r2-gpu-sharing",
      "title": "GPU Sharing \u2014 Round 2 (HAMi / MPS / dedicated)",
      "tags": [
        "gpu",
        "hami",
        "mps",
        "vllm",
        "round2"
      ],
      "timezone": "browser",
      "schemaVersion": 39,
      "version": 1,
      "refresh": "5s",
      "time": {
        "from": "now-30m",
        "to": "now"
      },
      "templating": {
        "list": [
          {
            "name": "DS_PROMETHEUS",
            "type": "datasource",
            "query": "prometheus",
            "current": {},
            "hide": 0,
            "label": "Datasource"
          },
          {
            "name": "node",
            "type": "query",
            "datasource": {
              "type": "prometheus",
              "uid": "${DS_PROMETHEUS}"
            },
            "query": "label_values(hami_gpu_core_limit_ratio, node)",
            "current": {
              "text": "mr-gholami",
              "value": "mr-gholami"
            },
            "refresh": 1,
            "label": "Node"
          }
        ]
      },
      "panels": [
        {
          "id": 100,
          "type": "row",
          "title": "HAMi \u2014 what the scheduler promised",
          "collapsed": false,
          "gridPos": {
            "x": 0,
            "y": 0,
            "w": 24,
            "h": 1
          },
          "panels": []
        },
        {
          "id": 1,
          "type": "timeseries",
          "title": "gpucores allocated per GPU",
          "description": "Sum of nvidia.com/gpucores requested by pods placed on each device, against the 100 ceiling. Round one established this is a PLACEMENT token, not a compute bound -- expect it to look neatly partitioned while the DCGM row below shows an even split.",
          "gridPos": {
            "x": 0,
            "y": 1,
            "w": 12,
            "h": 8
          },
          "datasource": {
            "type": "prometheus",
            "uid": "${DS_PROMETHEUS}"
          },
          "targets": [
            {
              "expr": "hami_gpu_core_allocated_ratio{node=\"$node\"}",
              "legendFormat": "GPU {{device_index}}  {{device_uuid}}",
              "refId": "A",
              "datasource": {
                "type": "prometheus",
                "uid": "${DS_PROMETHEUS}"
              }
            },
            {
              "expr": "hami_gpu_core_limit_ratio{node=\"$node\"}",
              "legendFormat": "limit GPU {{device_index}}",
              "refId": "B",
              "datasource": {
                "type": "prometheus",
                "uid": "${DS_PROMETHEUS}"
              }
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "percent",
              "custom": {
                "lineWidth": 2,
                "fillOpacity": 12,
                "showPoints": "never",
                "spanNulls": true,
                "stacking": {
                  "mode": "none"
                }
              }
            },
            "overrides": []
          },
          "options": {
            "legend": {
              "displayMode": "table",
              "placement": "bottom",
              "calcs": [
                "mean",
                "max",
                "lastNotNull"
              ]
            },
            "tooltip": {
              "mode": "multi",
              "sort": "desc"
            }
          }
        },
        {
          "id": 2,
          "type": "timeseries",
          "title": "gpumem allocated per GPU",
          "description": "nvidia.com/gpumem granted per device. Unlike gpucores this one is genuinely enforced -- round one measured peak VRAM inside quota under MPS.",
          "gridPos": {
            "x": 12,
            "y": 1,
            "w": 12,
            "h": 8
          },
          "datasource": {
            "type": "prometheus",
            "uid": "${DS_PROMETHEUS}"
          },
          "targets": [
            {
              "expr": "hami_gpu_memory_allocated_bytes{node=\"$node\"}",
              "legendFormat": "GPU {{device_index}}",
              "refId": "A",
              "datasource": {
                "type": "prometheus",
                "uid": "${DS_PROMETHEUS}"
              }
            },
            {
              "expr": "12884901888",
              "legendFormat": "physical 12 GiB",
              "refId": "B",
              "datasource": {
                "type": "prometheus",
                "uid": "${DS_PROMETHEUS}"
              }
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "bytes",
              "custom": {
                "lineWidth": 2,
                "fillOpacity": 12,
                "showPoints": "never",
                "spanNulls": true,
                "stacking": {
                  "mode": "none"
                }
              }
            },
            "overrides": []
          },
          "options": {
            "legend": {
              "displayMode": "table",
              "placement": "bottom",
              "calcs": [
                "mean",
                "max",
                "lastNotNull"
              ]
            },
            "tooltip": {
              "mode": "multi",
              "sort": "desc"
            }
          }
        },
        {
          "id": 200,
          "type": "row",
          "title": "Hardware \u2014 what the GPU actually did",
          "collapsed": false,
          "gridPos": {
            "x": 0,
            "y": 9,
            "w": 24,
            "h": 1
          },
          "panels": []
        },
        {
          "id": 3,
          "type": "timeseries",
          "title": "GPU utilization",
          "description": "Whether any kernel was resident. Round one found this pinned at 95-99% in nearly every configuration, so it discriminates almost nothing -- kept because its flatness is itself the evidence.",
          "gridPos": {
            "x": 0,
            "y": 10,
            "w": 8,
            "h": 8
          },
          "datasource": {
            "type": "prometheus",
            "uid": "${DS_PROMETHEUS}"
          },
          "targets": [
            {
              "expr": "DCGM_FI_DEV_GPU_UTIL{Hostname=~\"$node.*\"}",
              "legendFormat": "GPU {{gpu}}",
              "refId": "A",
              "datasource": {
                "type": "prometheus",
                "uid": "${DS_PROMETHEUS}"
              }
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "percent",
              "custom": {
                "lineWidth": 2,
                "fillOpacity": 12,
                "showPoints": "never",
                "spanNulls": true,
                "stacking": {
                  "mode": "none"
                }
              }
            },
            "overrides": []
          },
          "options": {
            "legend": {
              "displayMode": "table",
              "placement": "bottom",
              "calcs": [
                "mean",
                "max",
                "lastNotNull"
              ]
            },
            "tooltip": {
              "mode": "multi",
              "sort": "desc"
            }
          }
        },
        {
          "id": 4,
          "type": "timeseries",
          "title": "Framebuffer used",
          "description": "Real device memory in use, from DCGM rather than from inside a HAMi-intercepted container.",
          "gridPos": {
            "x": 8,
            "y": 10,
            "w": 8,
            "h": 8
          },
          "datasource": {
            "type": "prometheus",
            "uid": "${DS_PROMETHEUS}"
          },
          "targets": [
            {
              "expr": "DCGM_FI_DEV_FB_USED{Hostname=~\"$node.*\"} * 1024 * 1024",
              "legendFormat": "GPU {{gpu}} used",
              "refId": "A",
              "datasource": {
                "type": "prometheus",
                "uid": "${DS_PROMETHEUS}"
              }
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "bytes",
              "custom": {
                "lineWidth": 2,
                "fillOpacity": 12,
                "showPoints": "never",
                "spanNulls": true,
                "stacking": {
                  "mode": "none"
                }
              }
            },
            "overrides": []
          },
          "options": {
            "legend": {
              "displayMode": "table",
              "placement": "bottom",
              "calcs": [
                "mean",
                "max",
                "lastNotNull"
              ]
            },
            "tooltip": {
              "mode": "multi",
              "sort": "desc"
            }
          }
        },
        {
          "id": 5,
          "type": "timeseries",
          "title": "SM clock / power",
          "description": "Throttling control. Round one had to prove the force-policy decay was NOT thermal; holding clocks steady here is what licenses that claim.",
          "gridPos": {
            "x": 16,
            "y": 10,
            "w": 8,
            "h": 8
          },
          "datasource": {
            "type": "prometheus",
            "uid": "${DS_PROMETHEUS}"
          },
          "targets": [
            {
              "expr": "DCGM_FI_DEV_SM_CLOCK{Hostname=~\"$node.*\"}",
              "legendFormat": "GPU {{gpu}} SM MHz",
              "refId": "A",
              "datasource": {
                "type": "prometheus",
                "uid": "${DS_PROMETHEUS}"
              }
            },
            {
              "expr": "DCGM_FI_DEV_POWER_USAGE{Hostname=~\"$node.*\"}",
              "legendFormat": "GPU {{gpu}} W",
              "refId": "B",
              "datasource": {
                "type": "prometheus",
                "uid": "${DS_PROMETHEUS}"
              }
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "custom": {
                "lineWidth": 2,
                "fillOpacity": 12,
                "showPoints": "never",
                "spanNulls": true,
                "stacking": {
                  "mode": "none"
                }
              }
            },
            "overrides": []
          },
          "options": {
            "legend": {
              "displayMode": "table",
              "placement": "bottom",
              "calcs": [
                "mean",
                "max",
                "lastNotNull"
              ]
            },
            "tooltip": {
              "mode": "multi",
              "sort": "desc"
            }
          }
        },
        {
          "id": 300,
          "type": "row",
          "title": "vLLM \u2014 what each engine felt",
          "collapsed": false,
          "gridPos": {
            "x": 0,
            "y": 18,
            "w": 24,
            "h": 1
          },
          "panels": []
        },
        {
          "id": 6,
          "type": "timeseries",
          "title": "Time to first token",
          "description": "TTFT is damaged by PREFILL contention. This is the panel that should move when a compute-bound embedding neighbour starts a batch.",
          "gridPos": {
            "x": 0,
            "y": 19,
            "w": 12,
            "h": 8
          },
          "datasource": {
            "type": "prometheus",
            "uid": "${DS_PROMETHEUS}"
          },
          "targets": [
            {
              "expr": "histogram_quantile(0.99, sum by (le, r2_role) (rate(vllm:time_to_first_token_seconds_bucket{namespace=\"llm-demo\"}[1m])))",
              "legendFormat": "{{r2_role}} p99",
              "refId": "A",
              "datasource": {
                "type": "prometheus",
                "uid": "${DS_PROMETHEUS}"
              }
            },
            {
              "expr": "histogram_quantile(0.95, sum by (le, r2_role) (rate(vllm:time_to_first_token_seconds_bucket{namespace=\"llm-demo\"}[1m])))",
              "legendFormat": "{{r2_role}} p95",
              "refId": "B",
              "datasource": {
                "type": "prometheus",
                "uid": "${DS_PROMETHEUS}"
              }
            },
            {
              "expr": "histogram_quantile(0.50, sum by (le, r2_role) (rate(vllm:time_to_first_token_seconds_bucket{namespace=\"llm-demo\"}[1m])))",
              "legendFormat": "{{r2_role}} p50",
              "refId": "C",
              "datasource": {
                "type": "prometheus",
                "uid": "${DS_PROMETHEUS}"
              }
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "s",
              "custom": {
                "lineWidth": 2,
                "fillOpacity": 12,
                "showPoints": "never",
                "spanNulls": true,
                "stacking": {
                  "mode": "none"
                }
              }
            },
            "overrides": []
          },
          "options": {
            "legend": {
              "displayMode": "table",
              "placement": "bottom",
              "calcs": [
                "mean",
                "max",
                "lastNotNull"
              ]
            },
            "tooltip": {
              "mode": "multi",
              "sort": "desc"
            }
          }
        },
        {
          "id": 7,
          "type": "timeseries",
          "title": "Inter-token latency",
          "description": "ITL is damaged by DECODE contention, and is what a user perceives as stutter. Splitting it from TTFT is the instrumentation gap round one could not close, because it was not streaming.",
          "gridPos": {
            "x": 12,
            "y": 19,
            "w": 12,
            "h": 8
          },
          "datasource": {
            "type": "prometheus",
            "uid": "${DS_PROMETHEUS}"
          },
          "targets": [
            {
              "expr": "histogram_quantile(0.99, sum by (le, r2_role) (rate(vllm:time_per_output_token_seconds_bucket{namespace=\"llm-demo\"}[1m])))",
              "legendFormat": "{{r2_role}} p99",
              "refId": "A",
              "datasource": {
                "type": "prometheus",
                "uid": "${DS_PROMETHEUS}"
              }
            },
            {
              "expr": "histogram_quantile(0.95, sum by (le, r2_role) (rate(vllm:time_per_output_token_seconds_bucket{namespace=\"llm-demo\"}[1m])))",
              "legendFormat": "{{r2_role}} p95",
              "refId": "B",
              "datasource": {
                "type": "prometheus",
                "uid": "${DS_PROMETHEUS}"
              }
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "s",
              "custom": {
                "lineWidth": 2,
                "fillOpacity": 12,
                "showPoints": "never",
                "spanNulls": true,
                "stacking": {
                  "mode": "none"
                }
              }
            },
            "overrides": []
          },
          "options": {
            "legend": {
              "displayMode": "table",
              "placement": "bottom",
              "calcs": [
                "mean",
                "max",
                "lastNotNull"
              ]
            },
            "tooltip": {
              "mode": "multi",
              "sort": "desc"
            }
          }
        },
        {
          "id": 8,
          "type": "timeseries",
          "title": "Throughput \u2014 generation tokens/s",
          "description": "Stacked, so the aggregate across tenants is readable directly -- that aggregate is the number the three arms are compared on.",
          "gridPos": {
            "x": 0,
            "y": 27,
            "w": 8,
            "h": 8
          },
          "datasource": {
            "type": "prometheus",
            "uid": "${DS_PROMETHEUS}"
          },
          "targets": [
            {
              "expr": "sum by (r2_role) (rate(vllm:generation_tokens_total{namespace=\"llm-demo\"}[1m]))",
              "legendFormat": "{{r2_role}}",
              "refId": "A",
              "datasource": {
                "type": "prometheus",
                "uid": "${DS_PROMETHEUS}"
              }
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "none",
              "custom": {
                "lineWidth": 2,
                "fillOpacity": 40,
                "showPoints": "never",
                "spanNulls": true,
                "stacking": {
                  "mode": "normal"
                }
              }
            },
            "overrides": []
          },
          "options": {
            "legend": {
              "displayMode": "table",
              "placement": "bottom",
              "calcs": [
                "mean",
                "max",
                "lastNotNull"
              ]
            },
            "tooltip": {
              "mode": "multi",
              "sort": "desc"
            }
          }
        },
        {
          "id": 9,
          "type": "timeseries",
          "title": "Queue depth",
          "description": "Separates 'the GPU is slow' from 'the scheduler is holding requests'. Only observable because the client drives an OPEN loop -- a fixed concurrency loop can never build a queue.",
          "gridPos": {
            "x": 8,
            "y": 27,
            "w": 8,
            "h": 8
          },
          "datasource": {
            "type": "prometheus",
            "uid": "${DS_PROMETHEUS}"
          },
          "targets": [
            {
              "expr": "sum by (r2_role) (vllm:num_requests_running{namespace=\"llm-demo\"})",
              "legendFormat": "{{r2_role}} running",
              "refId": "A",
              "datasource": {
                "type": "prometheus",
                "uid": "${DS_PROMETHEUS}"
              }
            },
            {
              "expr": "sum by (r2_role) (vllm:num_requests_waiting{namespace=\"llm-demo\"})",
              "legendFormat": "{{r2_role}} waiting",
              "refId": "B",
              "datasource": {
                "type": "prometheus",
                "uid": "${DS_PROMETHEUS}"
              }
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "custom": {
                "lineWidth": 2,
                "fillOpacity": 12,
                "showPoints": "never",
                "spanNulls": true,
                "stacking": {
                  "mode": "none"
                }
              }
            },
            "overrides": []
          },
          "options": {
            "legend": {
              "displayMode": "table",
              "placement": "bottom",
              "calcs": [
                "mean",
                "max",
                "lastNotNull"
              ]
            },
            "tooltip": {
              "mode": "multi",
              "sort": "desc"
            }
          }
        },
        {
          "id": 10,
          "type": "timeseries",
          "title": "KV cache usage",
          "description": "The gpumem quota IS the KV budget. This panel is where the indirect concurrency control becomes visible.",
          "gridPos": {
            "x": 16,
            "y": 27,
            "w": 8,
            "h": 8
          },
          "datasource": {
            "type": "prometheus",
            "uid": "${DS_PROMETHEUS}"
          },
          "targets": [
            {
              "expr": "vllm:gpu_cache_usage_perc{namespace=\"llm-demo\"} * 100",
              "legendFormat": "{{r2_role}}",
              "refId": "A",
              "datasource": {
                "type": "prometheus",
                "uid": "${DS_PROMETHEUS}"
              }
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "percent",
              "custom": {
                "lineWidth": 2,
                "fillOpacity": 12,
                "showPoints": "never",
                "spanNulls": true,
                "stacking": {
                  "mode": "none"
                }
              }
            },
            "overrides": []
          },
          "options": {
            "legend": {
              "displayMode": "table",
              "placement": "bottom",
              "calcs": [
                "mean",
                "max",
                "lastNotNull"
              ]
            },
            "tooltip": {
              "mode": "multi",
              "sort": "desc"
            }
          }
        },
        {
          "id": 11,
          "type": "timeseries",
          "title": "Preemptions",
          "description": "A rising rate means the KV budget is too tight -- a quota problem, NOT a sharing problem. In throughput alone the two look identical.",
          "gridPos": {
            "x": 0,
            "y": 35,
            "w": 12,
            "h": 6
          },
          "datasource": {
            "type": "prometheus",
            "uid": "${DS_PROMETHEUS}"
          },
          "targets": [
            {
              "expr": "sum by (r2_role) (rate(vllm:num_preemptions_total{namespace=\"llm-demo\"}[1m]))",
              "legendFormat": "{{r2_role}}",
              "refId": "A",
              "datasource": {
                "type": "prometheus",
                "uid": "${DS_PROMETHEUS}"
              }
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "custom": {
                "lineWidth": 2,
                "fillOpacity": 12,
                "showPoints": "never",
                "spanNulls": true,
                "stacking": {
                  "mode": "none"
                }
              }
            },
            "overrides": []
          },
          "options": {
            "legend": {
              "displayMode": "table",
              "placement": "bottom",
              "calcs": [
                "mean",
                "max",
                "lastNotNull"
              ]
            },
            "tooltip": {
              "mode": "multi",
              "sort": "desc"
            }
          }
        },
        {
          "id": 12,
          "type": "timeseries",
          "title": "Prefix cache hit rate",
          "description": "Round one deliberately suppressed prefix reuse as a validity control. Round two allows it, so this must be reported alongside throughput or the comparison is not like-for-like.",
          "gridPos": {
            "x": 12,
            "y": 35,
            "w": 12,
            "h": 6
          },
          "datasource": {
            "type": "prometheus",
            "uid": "${DS_PROMETHEUS}"
          },
          "targets": [
            {
              "expr": "vllm:gpu_prefix_cache_hit_rate{namespace=\"llm-demo\"} * 100",
              "legendFormat": "{{r2_role}}",
              "refId": "A",
              "datasource": {
                "type": "prometheus",
                "uid": "${DS_PROMETHEUS}"
              }
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "percent",
              "custom": {
                "lineWidth": 2,
                "fillOpacity": 12,
                "showPoints": "never",
                "spanNulls": true,
                "stacking": {
                  "mode": "none"
                }
              }
            },
            "overrides": []
          },
          "options": {
            "legend": {
              "displayMode": "table",
              "placement": "bottom",
              "calcs": [
                "mean",
                "max",
                "lastNotNull"
              ]
            },
            "tooltip": {
              "mode": "multi",
              "sort": "desc"
            }
          }
        }
      ]
    }
