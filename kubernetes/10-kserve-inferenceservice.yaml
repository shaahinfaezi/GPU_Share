# KServe InferenceService with HuggingFace Server Runtime
# Gemma 3 1B model using official kserve/huggingfaceserver
#
# Prerequisites:
# 1. Download model: kubectl apply -f 07-download-model.yaml
#
apiVersion: "serving.kserve.io/v1beta1"
kind: "InferenceService"
metadata:
  name: "gemma-llm"
  namespace: gpu-share
spec:
  predictor:
    tolerations:
    - key: "node.kubernetes.io/disk-pressure"
      operator: "Exists"
    model:
      modelFormat:
        name: huggingface
      args:
        - --model_name=gemma
        - --model_id=/mnt/models
        - --max-model-len=2048
        - --gpu-memory-utilization=0.8
      env:
        - name: CUDA_VISIBLE_DEVICES
          value: "0"
        - name: VRAM_LIMIT_MB
          value: "4000"
        - name: CUDA_MPS_PIPE_DIRECTORY
          value: "/tmp/nvidia-mps"
      storageUri: pvc://model-storage/gemma-3-1b
      image: kserve/huggingfaceserver:v0.16.0-gpu
      resources:
        limits:
          cpu: "4"
          memory: 8Gi
          nvidia.com/gpu: "1"
        requests:
          cpu: "2"
          memory: 4Gi
          nvidia.com/gpu: "1"
