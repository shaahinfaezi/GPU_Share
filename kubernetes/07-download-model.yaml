# Download Gemma 3 1B model to PVC for KServe
# Run this ONCE before deploying InferenceServices
# 
# IMPORTANT: Gemma requires HuggingFace authentication!
# 1. Create account at https://huggingface.co
# 2. Accept license at https://huggingface.co/google/gemma-3-1b-it
# 3. Get token from https://huggingface.co/settings/tokens
# 4. Create secret: kubectl create secret generic hf-token --from-literal=token=YOUR_TOKEN -n gpu-share
#
apiVersion: batch/v1
kind: Job
metadata:
  name: download-gemma-model
  namespace: gpu-share
spec:
  ttlSecondsAfterFinished: 300
  template:
    spec:
      restartPolicy: Never
      containers:
      - name: downloader
        image: python:3.10-slim
        env:
        - name: HF_TOKEN
          valueFrom:
            secretKeyRef:
              name: hf-token
              key: token
        command:
        - bash
        - -c
        - |
          pip install transformers torch huggingface_hub --quiet
          python << 'EOF'
          from transformers import AutoModelForCausalLM, AutoTokenizer
          from huggingface_hub import login
          import os
          
          model_name = "google/gemma-3-1b-it"
          save_path = "/models/gemma-3-1b"
          
          # Login to HuggingFace
          hf_token = os.environ.get("HF_TOKEN")
          if hf_token:
              login(token=hf_token)
              print("Logged in to HuggingFace")
          else:
              print("WARNING: No HF_TOKEN found, download may fail for gated models")
          
          # Check if model already exists
          config_file = os.path.join(save_path, "config.json")
          if os.path.exists(config_file):
              print(f"Model already exists at {save_path}, skipping download!")
              print("Files:")
              for f in os.listdir(save_path):
                  size = os.path.getsize(os.path.join(save_path, f))
                  print(f"  {f}: {size / 1024 / 1024:.2f} MB")
          else:
              print(f"Downloading {model_name} to {save_path}...")
              os.makedirs(save_path, exist_ok=True)
              
              # Download model and tokenizer
              tokenizer = AutoTokenizer.from_pretrained(model_name, token=hf_token)
              model = AutoModelForCausalLM.from_pretrained(model_name, token=hf_token)
              
              # Save locally
              tokenizer.save_pretrained(save_path)
              model.save_pretrained(save_path)
              
              print(f"Model saved to {save_path}")
              print("Files:")
              for f in os.listdir(save_path):
                  size = os.path.getsize(os.path.join(save_path, f))
                  print(f"  {f}: {size / 1024 / 1024:.2f} MB")
          EOF
        volumeMounts:
        - name: model-storage
          mountPath: /models
        - name: pip-cache
          mountPath: /root/.cache/pip
        - name: hf-cache
          mountPath: /root/.cache/huggingface
      volumes:
      - name: model-storage
        persistentVolumeClaim:
          claimName: model-storage
      - name: pip-cache
        persistentVolumeClaim:
          claimName: pip-cache
      - name: hf-cache
        persistentVolumeClaim:
          claimName: hf-cache
---
# PV for model storage pointing to /data2
apiVersion: v1
kind: PersistentVolume
metadata:
  name: model-storage-pv
spec:
  capacity:
    storage: 20Gi
  accessModes:
    - ReadWriteOnce
  persistentVolumeReclaimPolicy: Retain
  hostPath:
    path: /data2/gpu-share/models
    type: DirectoryOrCreate
  storageClassName: manual
---
# PVC for model storage (persists downloaded models)
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: model-storage
  namespace: gpu-share
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 20Gi
  storageClassName: manual
  volumeName: model-storage-pv
---
# PV for pip cache pointing to /data2
apiVersion: v1
kind: PersistentVolume
metadata:
  name: pip-cache-pv
spec:
  capacity:
    storage: 5Gi
  accessModes:
    - ReadWriteOnce
  persistentVolumeReclaimPolicy: Retain
  hostPath:
    path: /data2/gpu-share/pip-cache
    type: DirectoryOrCreate
  storageClassName: manual
---
# PVC for pip cache (persists pip packages)
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: pip-cache
  namespace: gpu-share
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 5Gi
  storageClassName: manual
  volumeName: pip-cache-pv
---
# PV for HF cache pointing to /data2
apiVersion: v1
kind: PersistentVolume
metadata:
  name: hf-cache-pv
spec:
  capacity:
    storage: 10Gi
  accessModes:
    - ReadWriteOnce
  persistentVolumeReclaimPolicy: Retain
  hostPath:
    path: /data2/gpu-share/hf-cache
    type: DirectoryOrCreate
  storageClassName: manual
---
# PVC for HuggingFace cache (persists HF downloads)
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: hf-cache
  namespace: gpu-share
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 10Gi
  storageClassName: manual
  volumeName: hf-cache-pv
