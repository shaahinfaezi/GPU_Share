# Download Gemma 3 1B model to PVC for KServe
# Run this ONCE before deploying InferenceServices
# 
# IMPORTANT: Gemma requires HuggingFace authentication!
# 1. Create account at https://huggingface.co
# 2. Accept license at https://huggingface.co/google/gemma-3-1b-it
# 3. Get token from https://huggingface.co/settings/tokens
# 4. Create secret: kubectl create secret generic hf-token --from-literal=token=YOUR_TOKEN -n gpu-share
#
apiVersion: batch/v1
kind: Job
metadata:
  name: download-gemma-model
  namespace: gpu-share
spec:
  ttlSecondsAfterFinished: 300
  template:
    spec:
      restartPolicy: Never
      # Use host network and host DNS (simplest connectivity)
      hostNetwork: true
      dnsPolicy: Default
      # Tolerate disk pressure to allow running even if / partition is full
      tolerations:
      - key: "node.kubernetes.io/disk-pressure"
        operator: "Exists"
        effect: "NoSchedule"
      containers:
      - name: downloader
        image: alpine/git
        env:
        - name: GIT_TERMINAL_PROMPT
          value: "0"
        - name: HF_TOKEN
          valueFrom:
            secretKeyRef:
              name: hf-token
              key: token
        command:
        - /bin/sh
        - -c
        - |
          echo "Starting generic download via Git..."
          echo "This avoids pip/python DNS dependencies."
          
          # Initialize LFS
          git lfs install
          
          MODEL_REPO="https://oauth2:${HF_TOKEN}@huggingface.co/google/gemma-3-1b-it"
          TARGET_DIR="/models/gemma-3-1b"
          
          mkdir -p $TARGET_DIR
          cd /models
          
          if [ -d "$TARGET_DIR/.git" ]; then
             echo "Updating existing model..."
             cd $TARGET_DIR
             git pull
          else
             echo "Cloning model (this handles all large files automatically)..."
             git clone $MODEL_REPO $TARGET_DIR
          fi
          
          echo "Download complete. Files:"
          ls -lh $TARGET_DIR
        volumeMounts:
        - name: model-storage
          mountPath: /models
        - name: pip-cache
          mountPath: /root/.cache/pip
        - name: hf-cache
          mountPath: /root/.cache/huggingface
      volumes:
      - name: model-storage
        persistentVolumeClaim:
          claimName: model-storage
      - name: pip-cache
        persistentVolumeClaim:
          claimName: pip-cache
      - name: hf-cache
        persistentVolumeClaim:
          claimName: hf-cache
---
# PV for model storage pointing to /data2
apiVersion: v1
kind: PersistentVolume
metadata:
  name: model-storage-pv
spec:
  capacity:
    storage: 20Gi
  accessModes:
    - ReadWriteOnce
  persistentVolumeReclaimPolicy: Retain
  hostPath:
    path: /data2/gpu-share/models
    type: DirectoryOrCreate
  storageClassName: manual
---
# PVC for model storage (persists downloaded models)
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: model-storage
  namespace: gpu-share
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 20Gi
  storageClassName: manual
  volumeName: model-storage-pv
---
# PV for pip cache pointing to /data2
apiVersion: v1
kind: PersistentVolume
metadata:
  name: pip-cache-pv
spec:
  capacity:
    storage: 5Gi
  accessModes:
    - ReadWriteOnce
  persistentVolumeReclaimPolicy: Retain
  hostPath:
    path: /data2/gpu-share/pip-cache
    type: DirectoryOrCreate
  storageClassName: manual
---
# PVC for pip cache (persists pip packages)
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: pip-cache
  namespace: gpu-share
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 5Gi
  storageClassName: manual
  volumeName: pip-cache-pv
---
# PV for HF cache pointing to /data2
apiVersion: v1
kind: PersistentVolume
metadata:
  name: hf-cache-pv
spec:
  capacity:
    storage: 10Gi
  accessModes:
    - ReadWriteOnce
  persistentVolumeReclaimPolicy: Retain
  hostPath:
    path: /data2/gpu-share/hf-cache
    type: DirectoryOrCreate
  storageClassName: manual
---
# PVC for HuggingFace cache (persists HF downloads)
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: hf-cache
  namespace: gpu-share
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 10Gi
  storageClassName: manual
  volumeName: hf-cache-pv
