# Based on tested configurations; site bindings are recorded in pool-provenance.json.
apiVersion: serving.kserve.io/v1alpha1
kind: LLMInferenceService
metadata:
  name: pool-hami-mps-tp
  namespace: llm-demo
  labels:
    r2-arm: hami-mps
    r2-role: tp
    r2-series: qwen7b-tp2-pp2
    r2-probe: ba30523dca9145e4ba4d8a3a0c5ac459
    gpu-share.io/pool: hami-mps
spec:
  model:
    name: Qwen/Qwen2.5-7B-Instruct-AWQ
    uri: pvc://pool-hami-mps-models/models/llm
  replicas: 1
  template:
    nodeSelector:
      gpu-share.io/pool: hami-mps
    containers:
    - name: main
      image: 127.0.0.1:5000/kserve/huggingfaceserver:v0.17.0-gpu
      command:
      - python
      - -m
      - vllm.entrypoints.openai.api_server
      args:
      - --model
      - /mnt/models
      - --served-model-name
      - Qwen/Qwen2.5-7B-Instruct-AWQ
      - --host
      - 0.0.0.0
      - --port
      - '8000'
      - --tensor-parallel-size
      - '2'
      - --pipeline-parallel-size
      - '1'
      - --max-num-seqs
      - '2'
      - --max-model-len
      - '1024'
      - --enforce-eager
      - --max-num-batched-tokens
      - '256'
      - --enable-chunked-prefill
      - --distributed-executor-backend
      - mp
      - --gpu-memory-utilization
      - '0.7'
      - --kv-cache-memory-bytes
      - '268435456'
      - --no-enable-prefix-caching
      - --safetensors-load-strategy
      - lazy
      - --load-format
      - safetensors
      - --quantization
      - awq_marlin
      - --dtype
      - half
      startupProbe:
        httpGet:
          path: /health
          port: 8000
        periodSeconds: 5
        failureThreshold: 180
      readinessProbe:
        httpGet:
          path: /health
          port: 8000
        periodSeconds: 5
      resources:
        limits:
          cpu: '2'
          memory: 6Gi
          nvidia.com/gpu: '2'
          nvidia.com/gpumem: '5632'
          nvidia.com/gpucores: '50'
        requests:
          cpu: 100m
          memory: 4Gi
          nvidia.com/gpu: '2'
          nvidia.com/gpumem: '5632'
          nvidia.com/gpucores: '50'
      env:
      - name: HF_HOME
        value: /mnt/models
      - name: VLLM_ADDITIONAL_ARGS
        value: --tensor-parallel-size 2 --pipeline-parallel-size 1 --max-num-seqs
          2 --max-model-len 1024 --enforce-eager --max-num-batched-tokens 256 --enable-chunked-prefill
          --distributed-executor-backend mp --gpu-memory-utilization 0.7 --kv-cache-memory-bytes
          268435456 --no-enable-prefix-caching --safetensors-load-strategy lazy --load-format
          safetensors --quantization awq_marlin --dtype half
      - name: MALLOC_ARENA_MAX
        value: '2'
      - name: TOKENIZERS_PARALLELISM
        value: 'false'
      - name: OMP_NUM_THREADS
        value: '1'
      - name: CUDA_MODULE_LOADING
        value: LAZY
      - name: VLLM_WORKER_MULTIPROC_METHOD
        value: fork
      - name: CUDA_MPS_PIPE_DIRECTORY
        value: /tmp/nvidia-mps
      - name: CUDA_MPS_LOG_DIRECTORY
        value: /tmp/nvidia-mps
      - name: CUDA_MPS_ACTIVE_THREAD_PERCENTAGE
        value: '100'
      volumeMounts:
      - name: mps-pipe
        mountPath: /tmp/nvidia-mps
    volumes:
    - name: mps-pipe
      hostPath:
        path: /tmp/nvidia-mps
        type: Directory
    runtimeClassName: nvidia
